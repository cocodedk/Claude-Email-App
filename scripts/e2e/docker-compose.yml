# Real mail server for the on-emulator end-to-end test.
#
# GreenMail is a full SMTP/IMAP implementation, not a stub: the app's Angus Mail
# stack and the claude-email backend both speak ordinary SMTP/IMAP to it over
# ordinary TCP sockets. Nothing in the mail path is simulated.
#
# This is a SEPARATE compose project from the backend suite's
# tests/e2e/docker-compose.yml — own container name, own ports — so running this
# harness can never disturb a python e2e session (or be disturbed by one), and
# `down -v` here destroys only this server's mailboxes.
#
# Why auth is disabled
# --------------------
# GreenMail authenticates on the *bare local part* of a configured user and
# rejects the full address ("Invalid login/password for user id
# e2e-sender@e2e.test" — verified against 2.1.9, not assumed). The app derives
# its IMAP/SMTP login from MailCredentials.emailAddress, which must be a routable
# address because it is also the From header the backend's AUTHORIZED_SENDER
# check reads. Those two facts cannot both hold with a configured user, and the
# app's login derivation is production code this slice must not bend.
#
# So the mail server accepts any login and keys mailboxes by address. That is a
# property of the test *peer*, not of the system under test: the app still
# performs a real SMTP AUTH LOGIN over a real TLS socket, and the controls this
# harness actually exercises — the shared secret and AUTHORIZED_SENDER — live in
# the backend and stay fully armed.
#
# Every port binds to 127.0.0.1. The emulator reaches them through 10.0.2.2,
# which is its NAT alias for the host loopback.
services:
  mailserver:
    image: greenmail/standalone:2.1.9
    container_name: ${CLAUDE_EMAIL_APP_E2E_CONTAINER:-claude-email-app-e2e-mailserver}
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "127.0.0.1:${CLAUDE_EMAIL_APP_E2E_SMTP_PORT:-14025}:3025"
      - "127.0.0.1:${CLAUDE_EMAIL_APP_E2E_IMAP_PORT:-14143}:3143"
